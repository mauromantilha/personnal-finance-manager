name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  # ── Admin Worker ─────────────────────────────────────────────────────────────
  deploy-admin:
    name: Admin Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/admin/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit          # type-check gate — bloqueia deploy se houver erro de tipo
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Finance Worker ───────────────────────────────────────────────────────────
  deploy-finance:
    name: Finance Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/finance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/finance/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit          # type-check gate — bloqueia deploy se houver erro de tipo
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── CF Pages (SPA) ───────────────────────────────────────────────────────────
  deploy-pages:
    name: CF Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint             # type-check gate (tsc --noEmit) — bloqueia deploy com erro de tipo
      - run: npm run build

      - run: npx wrangler pages deploy dist --project-name=mks-financas --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
