name            = "mks-finance"
main            = "src/index.ts"
compatibility_date = "2025-05-25"

# Serve *.financaslivre.com/api/*
routes = [
  { pattern = "*.financaslivre.com/api/*", zone_name = "financaslivre.com" }
]

[[kv_namespaces]]
binding = "MKS_TENANTS"
id      = "6017e7ceeaa84a0fa7d7c798ce22bce8"

[[kv_namespaces]]
binding = "MKS_CACHE"
id      = "f21654ee37724befa85449a4cc1af3be"

[vars]
CF_ACCOUNT_ID      = "9b61f609fee4408fd1c4344feaf9b16a"
CF_ZONE_ID         = "350977938b4449f053202db04e455be1"   # financaslivre.com
CF_TEAM_DOMAIN     = "mks-personnal-finance-manager"
BASE_DOMAIN        = "financaslivre.com"

# Secrets — registrar com: wrangler secret put <NOME>
# CF_EMAIL_TOKEN
# CF_API_TOKEN
# GROQ_API_KEY
# RESEND_API_KEY
# CPF_SALT

[[r2_buckets]]
binding     = "MKS_DOCUMENTS"
bucket_name = "mks-documents"

[ai]
binding = "AI"

[observability]
enabled = true
