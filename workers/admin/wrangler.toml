name            = "mks-admin"
main            = "src/index.ts"
compatibility_date = "2025-05-25"

routes = [
  { pattern = "admin.financaslivre.com/*", zone_name = "financaslivre.com" },
  { pattern = "*.financaslivre.com/*",     zone_name = "financaslivre.com" }
]

# Importa arquivos .sql como strings para o migrations runner
[[rules]]
type        = "Text"
globs       = ["**/*.sql"]
fallthrough = false

[[kv_namespaces]]
binding = "MKS_TENANTS"
id      = "6017e7ceeaa84a0fa7d7c798ce22bce8"

[[kv_namespaces]]
binding = "MKS_ADMIN"
id      = "593f7fe311e843df848bcb8c755e86c4"

[vars]
CF_ACCOUNT_ID    = "9b61f609fee4408fd1c4344feaf9b16a"
CF_ZONE_ID       = "350977938b4449f053202db04e455be1"   # financaslivre.com
CF_TEAM_DOMAIN   = "mks-personnal-finance-manager"
BASE_DOMAIN      = "financaslivre.com"
ZT_OTP_IDP_ID    = "9737c8ad-db9e-458e-a5ea-bf0cb9c145dd"
ZT_ADMIN_APP_AUD  = "523b24f3dbbedfaa13534ff852a1580bd3901e80bf14272e1ca5db116db698e8"
CF_PAGES_PROJECT  = "mks-financas"
RESEND_FROM_DOMAIN = "financaslivre.com"
D1_FREE_LIMIT    = "10"
D1_PAID_LIMIT    = "50000"
ZT_FREE_LIMIT    = "50"
# Limpeza automática de tenants pending órfãos (>48h). Destrutivo: mantenha "false"
# e valide antes via POST /api/maintenance/pending-cleanup?apply=1 (dry-run sem apply).
AUTO_CLEANUP     = "false"

# Secrets — registrar com: wrangler secret put <NOME>
# CF_API_TOKEN          — token D1/R2/KV (D1:Edit, R2:Edit, KV:Edit, Analytics:Read)
# CF_ZT_TOKEN           — token Zero Trust (Access:Read) para contagem de usuários ZT
# ADMIN_PASSWORD
# RESEND_API_KEY
# TURNSTILE_SECRET_KEY
# CPF_SALT              — PBKDF2 salt para hash de CPF (gere com openssl rand -hex 32)
# APP_SECRET            — HMAC para tokens de verificação de email (gere com openssl rand -hex 32)

# Service binding: se a rota ampla *.financaslivre.com/* interceptar /api/*,
# o Admin encaminha ao Finance Worker em vez de proxiar HTML do Pages.
[[services]]
binding = "FINANCE"
service = "mks-finance"

[observability]
enabled = true

# Cron diário (04:00 UTC) — varredura de tenants pending órfãos.
# Só deleta se AUTO_CLEANUP="true"; caso contrário roda em dry-run e apenas loga.
[triggers]
crons = ["0 4 * * *"]
